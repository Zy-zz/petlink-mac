[package]
name = "petlink"
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "petlink"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"
secp256k1 = { version = "0.31", features = ["rand", "global-context"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
rand = "0.9"
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSPasteboard"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
